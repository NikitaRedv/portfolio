{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Portfolio{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="animated-background d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">

                <!-- Mobile menu button -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navigation links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'projects' %}">
                                Projects
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'skills' %}">
                                Skills
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="text-center py-4 text-muted border-top bg-white mt-auto">
        <div class="container">

            <h5 class="mb-3">Connect With Me</h5>

            <div class="social-links mb-3">

                <!-- GitHub -->
                <a href="https://github.com/NikitaRedv"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="GitHub">
                    <i class="bi bi-github"></i>
                </a>

                <!-- Telegram -->
                <a href="https://t.me/DonaldjohniTrump"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Telegram">
                    <i class="bi bi-telegram"></i>
                </a>

                <!-- Discord -->
                <a href="https://discord.com/users/819862796119572520"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Discord">
                    <i class="bi bi-discord"></i>
                </a>

                <!-- Email -->
                <a href="mailto:nikitaredvanskij@gmail.com"
                   aria-label="Email">
                    <i class="bi bi-envelope-fill"></i>
                </a>

            </div>

            <p class="mb-0">
                &copy; 2026 My Portfolio. All rights reserved.
            </p>

        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
