{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Portfolio{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="animated-background d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">

                <!-- Mobile menu button -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navigation links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'projects' %}">
                                Projects
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'skills' %}">
                                Skills
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'games' %}">
                                Games
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="text-center py-4 text-muted border-top bg-white mt-auto">
        <div class="container">

            <h5 class="mb-3">Connect With Me</h5>

            <div class="social-links mb-3">

                <!-- GitHub -->
                <a href="https://github.com/NikitaRedv"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="GitHub">
                    <i class="bi bi-github"></i>
                </a>

                <!-- Telegram -->
                <a href="https://t.me/DonaldjohniTrump"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Telegram">
                    <i class="bi bi-telegram"></i>
                </a>

                <!-- Discord -->
                <a href="https://discord.com/users/819862796119572520"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Discord">
                    <i class="bi bi-discord"></i>
                </a>

                <!-- Email -->
                <a href="mailto:nikitaredvanskij@gmail.com"
                   aria-label="Email">
                    <i class="bi bi-envelope-fill"></i>
                </a>

            </div>

            <p class="mb-0">
                &copy; 2026 My Portfolio. All rights reserved.
            </p>

        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <div class="music-player">
        <button id="music-toggle" type="button" aria-label="Увімкнути музику">
            <i class="bi bi-play-fill"></i>
        </button>

        <div class="music-info">
            <span class="music-title">Quiet Architecture</span>
            <span id="music-status">Музика вимкнена</span>
        </div>

        <button id="music-mute" type="button" aria-label="Вимкнути звук">
            <i class="bi bi-volume-up-fill"></i>
        </button>

        <input
            id="music-volume"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.25"
            aria-label="Гучність"
        >

        <audio id="background-music" loop preload="none">
            <source src="/static/audio/background.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const audio = document.getElementById("background-music");
        const toggle = document.getElementById("music-toggle");
        const mute = document.getElementById("music-mute");
        const volume = document.getElementById("music-volume");
        const status = document.getElementById("music-status");

        audio.volume = Number(volume.value);

        toggle.addEventListener("click", async function () {
            if (audio.paused) {
                try {
                    await audio.play();
                    toggle.innerHTML = '<i class="bi bi-pause-fill"></i>';
                    toggle.setAttribute("aria-label", "Поставити музику на паузу");
                    status.textContent = "Музика грає";
                } catch (error) {
                    status.textContent = "Не вдалося відтворити музику";
                }
            } else {
                audio.pause();
                toggle.innerHTML = '<i class="bi bi-play-fill"></i>';
                toggle.setAttribute("aria-label", "Увімкнути музику");
                status.textContent = "Музика на паузі";
            }
        });

        volume.addEventListener("input", function () {
            audio.volume = Number(volume.value);
            audio.muted = false;
            mute.innerHTML = audio.volume === 0
                ? '<i class="bi bi-volume-mute-fill"></i>'
                : '<i class="bi bi-volume-up-fill"></i>';
        });

        mute.addEventListener("click", function () {
            audio.muted = !audio.muted;
            mute.innerHTML = audio.muted
                ? '<i class="bi bi-volume-mute-fill"></i>'
                : '<i class="bi bi-volume-up-fill"></i>';
            mute.setAttribute(
                "aria-label",
                audio.muted ? "Увімкнути звук" : "Вимкнути звук"
            );
        });
    });
    </script>
</body>
</html>
